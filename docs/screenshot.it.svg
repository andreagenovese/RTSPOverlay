<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Immagine illustrativa (non uno screenshot reale): desktop macOS con tre overlay RTSP Overlay e il menu nella barra. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3A67"/>
      <stop offset="0.55" stop-color="#5C4B8A"/>
      <stop offset="1" stop-color="#C77D8E"/>
    </linearGradient>
    <linearGradient id="daySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FB6E8"/>
      <stop offset="1" stop-color="#CFE4F5"/>
    </linearGradient>
    <linearGradient id="dayGrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E9A4E"/>
      <stop offset="1" stop-color="#4C7536"/>
    </linearGradient>
    <linearGradient id="irSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#3A3A3A"/>
    </linearGradient>
    <linearGradient id="irGrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A9A9A"/>
      <stop offset="1" stop-color="#5E5E5E"/>
    </linearGradient>
    <radialGradient id="irVignette" cx="0.5" cy="0.55" r="0.7">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <linearGradient id="garageFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8C8F94"/>
      <stop offset="1" stop-color="#5F6368"/>
    </linearGradient>
    <linearGradient id="nameFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.9"/>
    </filter>
    <clipPath id="clipA"><rect width="400" height="225" rx="10"/></clipPath>
    <clipPath id="clipB"><rect width="400" height="225" rx="10"/></clipPath>
    <clipPath id="clipC"><rect width="320" height="180" rx="10"/></clipPath>
  </defs>

  <!-- Sfondo scrivania -->
  <rect width="1440" height="900" fill="url(#wall)"/>
  <circle cx="1180" cy="760" r="420" fill="#F2A6A0" opacity="0.18"/>
  <circle cx="220" cy="120" r="360" fill="#3E8EDE" opacity="0.15"/>

  <!-- Barra dei menu -->
  <rect width="1440" height="28" fill="#1E1E28" opacity="0.55"/>
  <g fill="#fff" font-size="13">
    <text x="20" y="19" font-weight="700">Note</text>
    <text x="72" y="19">Archivio</text>
    <text x="140" y="19">Modifica</text>
    <text x="212" y="19">Vista</text>
    <text x="260" y="19">Finestra</text>
    <text x="1428" y="19" text-anchor="end">gio 2 ott  10:41</text>
  </g>
  <!-- icona Wi-Fi stilizzata -->
  <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
    <path d="M1300 12 a9 9 0 0 1 14 0"/>
    <path d="M1303 15.5 a5 5 0 0 1 8 0"/>
  </g>
  <circle cx="1307" cy="19" r="1.6" fill="#fff"/>
  <!-- icona dell'app (evidenziata: menu aperto) -->
  <rect x="1250" y="3" width="32" height="22" rx="5" fill="#fff" opacity="0.25"/>
  <g fill="#fff">
    <rect x="1256" y="9" width="14" height="10" rx="2.5"/>
    <path d="M1271 12.5 L1277 9.5 V18.5 L1271 15.5 Z"/>
  </g>

  <!-- Finestra di lavoro sullo sfondo -->
  <g filter="url(#shadow)">
    <rect x="60" y="70" width="820" height="580" rx="12" fill="#FBFBFD"/>
  </g>
  <rect x="60" y="70" width="820" height="52" rx="12" fill="#ECECF0"/>
  <rect x="60" y="110" width="820" height="12" fill="#ECECF0"/>
  <line x1="60" y1="122" x2="880" y2="122" stroke="#D6D6DC"/>
  <circle cx="84" cy="96" r="6.5" fill="#FF5F57"/>
  <circle cx="106" cy="96" r="6.5" fill="#FEBC2E"/>
  <circle cx="128" cy="96" r="6.5" fill="#28C840"/>
  <text x="470" y="101" text-anchor="middle" font-size="13" font-weight="600" fill="#3A3A40">Preventivo impianto.txt</text>
  <g fill="#3A3A40" font-size="15">
    <text x="100" y="170" font-size="22" font-weight="700">Preventivo impianto</text>
    <text x="100" y="210">Mentre lavori, le telecamere restano visibili in un angolo dello schermo,</text>
    <text x="100" y="236">sempre in primo piano e su tutte le scrivanie.</text>
  </g>
  <g fill="#D9D9E0">
    <rect x="100" y="270" width="680" height="12" rx="6"/>
    <rect x="100" y="296" width="620" height="12" rx="6"/>
    <rect x="100" y="322" width="650" height="12" rx="6"/>
    <rect x="100" y="348" width="420" height="12" rx="6"/>
    <rect x="100" y="400" width="660" height="12" rx="6"/>
    <rect x="100" y="426" width="600" height="12" rx="6"/>
    <rect x="100" y="452" width="360" height="12" rx="6"/>
    <rect x="100" y="504" width="640" height="12" rx="6"/>
    <rect x="100" y="530" width="300" height="12" rx="6"/>
  </g>

  <!-- Overlay 1: Ingresso (giorno, colori) -->
  <g transform="translate(1010 390)">
    <rect width="400" height="225" rx="10" fill="#000" filter="url(#shadow)"/>
    <g clip-path="url(#clipA)">
      <rect width="400" height="225" fill="url(#daySky)"/>
      <ellipse cx="90" cy="40" rx="46" ry="12" fill="#fff" opacity="0.7"/>
      <ellipse cx="300" cy="28" rx="36" ry="9" fill="#fff" opacity="0.6"/>
      <rect y="135" width="400" height="90" fill="url(#dayGrass)"/>
      <!-- casa -->
      <path d="M150 70 L250 30 L350 70 Z" fill="#8C4A3A"/>
      <rect x="160" y="70" width="180" height="85" fill="#E9DCC4"/>
      <rect x="235" y="100" width="32" height="55" fill="#6B4430"/>
      <circle cx="261" cy="129" r="2" fill="#D9B45A"/>
      <rect x="180" y="88" width="34" height="28" fill="#9CC3E0" stroke="#fff" stroke-width="3"/>
      <rect x="288" y="88" width="34" height="28" fill="#9CC3E0" stroke="#fff" stroke-width="3"/>
      <!-- vialetto -->
      <path d="M235 155 L267 155 L330 225 L150 225 Z" fill="#C9C1B1"/>
      <!-- albero -->
      <rect x="60" y="110" width="8" height="40" fill="#5A3E2B"/>
      <circle cx="64" cy="98" r="28" fill="#3F6E2F"/>
      <circle cx="48" cy="110" r="18" fill="#4A7D38"/>
      <!-- siepe -->
      <rect x="0" y="140" width="140" height="18" rx="9" fill="#3B6A2D"/>
      <rect x="360" y="140" width="60" height="18" rx="9" fill="#3B6A2D"/>
      <!-- OSD data/ora -->
      <text x="12" y="22" font-family="Menlo, monospace" font-size="12" fill="#fff" filter="url(#textShadow)">02-10-2026 gio 10:41:07</text>
      <rect y="175" width="400" height="50" fill="url(#nameFade)"/>
      <text x="10" y="212" font-size="12" font-weight="600" fill="#fff" filter="url(#textShadow)">Ingresso</text>
    </g>
  </g>

  <!-- Overlay 2: Giardino (notte, infrarossi) -->
  <g transform="translate(1010 635)">
    <rect width="400" height="225" rx="10" fill="#000" filter="url(#shadow)"/>
    <g clip-path="url(#clipB)">
      <rect width="400" height="225" fill="url(#irSky)"/>
      <rect y="120" width="400" height="105" fill="url(#irGrass)"/>
      <!-- alberi -->
      <circle cx="70" cy="85" r="44" fill="#4A4A4A"/>
      <circle cx="120" cy="100" r="32" fill="#555"/>
      <rect x="66" y="110" width="9" height="30" fill="#2E2E2E"/>
      <circle cx="330" cy="80" r="50" fill="#444"/>
      <rect x="326" y="110" width="10" height="32" fill="#2A2A2A"/>
      <!-- recinzione -->
      <g fill="#B5B5B5">
        <rect x="0" y="128" width="400" height="4"/>
        <rect x="0" y="146" width="400" height="4"/>
        <rect x="20" y="118" width="6" height="40"/>
        <rect x="90" y="118" width="6" height="40"/>
        <rect x="160" y="118" width="6" height="40"/>
        <rect x="230" y="118" width="6" height="40"/>
        <rect x="300" y="118" width="6" height="40"/>
        <rect x="370" y="118" width="6" height="40"/>
      </g>
      <!-- sedia da giardino e tavolino -->
      <rect x="200" y="175" width="60" height="6" fill="#D0D0D0"/>
      <rect x="205" y="181" width="5" height="22" fill="#C0C0C0"/>
      <rect x="250" y="181" width="5" height="22" fill="#C0C0C0"/>
      <rect width="400" height="225" fill="url(#irVignette)"/>
      <text x="12" y="22" font-family="Menlo, monospace" font-size="12" fill="#fff" filter="url(#textShadow)">02-10-2026 gio 10:41:07</text>
      <text x="388" y="22" text-anchor="end" font-family="Menlo, monospace" font-size="11" fill="#fff" opacity="0.85" filter="url(#textShadow)">IR</text>
      <rect y="175" width="400" height="50" fill="url(#nameFade)"/>
      <text x="10" y="212" font-size="12" font-weight="600" fill="#fff" filter="url(#textShadow)">Giardino</text>
    </g>
  </g>

  <!-- Overlay 3: Garage (opacità ridotta, sopra la finestra di lavoro) -->
  <g transform="translate(620 470)" opacity="0.82">
    <rect width="320" height="180" rx="10" fill="#000" filter="url(#shadow)"/>
    <g clip-path="url(#clipC)">
      <rect width="320" height="180" fill="#C9CBCF"/>
      <rect y="105" width="320" height="75" fill="url(#garageFloor)"/>
      <!-- scaffale -->
      <rect x="18" y="30" width="70" height="80" fill="#8A7458"/>
      <rect x="18" y="55" width="70" height="4" fill="#5E4C36"/>
      <rect x="18" y="80" width="70" height="4" fill="#5E4C36"/>
      <rect x="26" y="40" width="16" height="15" fill="#C0392B"/>
      <rect x="50" y="64" width="24" height="16" fill="#2E86C1"/>
      <!-- auto -->
      <path d="M130 130 Q140 95 175 92 L245 92 Q275 95 290 130 Z" fill="#2C3E50"/>
      <rect x="120" y="125" width="180" height="32" rx="10" fill="#34495E"/>
      <path d="M160 100 L240 100 L262 124 L145 124 Z" fill="#7F9CB3"/>
      <circle cx="152" cy="158" r="13" fill="#1B1B1B"/>
      <circle cx="268" cy="158" r="13" fill="#1B1B1B"/>
      <rect x="126" y="134" width="16" height="7" rx="3" fill="#F5E6A8"/>
      <rect x="278" y="134" width="16" height="7" rx="3" fill="#F5E6A8"/>
      <text x="10" y="20" font-family="Menlo, monospace" font-size="11" fill="#fff" filter="url(#textShadow)">02-10-2026 gio 10:41:07</text>
      <rect y="135" width="320" height="45" fill="url(#nameFade)"/>
      <text x="10" y="169" font-size="12" font-weight="600" fill="#fff" filter="url(#textShadow)">Garage</text>
    </g>
  </g>

  <!-- Menu della barra -->
  <g transform="translate(1140 32)">
    <rect width="270" height="254" rx="9" fill="#2A2A30" opacity="0.94" filter="url(#shadow)"/>
    <rect width="270" height="254" rx="9" fill="none" stroke="#fff" stroke-opacity="0.12"/>
    <g font-size="13" fill="#EDEDF2">
      <text x="14" y="26">✓</text><text x="32" y="26">Ingresso</text>
      <text x="14" y="50">✓</text><text x="32" y="50">Giardino</text>
      <text x="14" y="74">✓</text><text x="32" y="74">Garage</text>
      <text x="32" y="98">Cortile</text>
    </g>
    <line x1="10" y1="111" x2="260" y2="111" stroke="#fff" stroke-opacity="0.15"/>
    <rect x="6" y="117" width="258" height="22" rx="5" fill="#2F6FEB"/>
    <g font-size="13" fill="#EDEDF2">
      <text x="32" y="133" fill="#fff">Apri tutte in overlay</text>
      <text x="32" y="157">Chiudi tutti gli overlay</text>
      <text x="32" y="181">Griglia con tutte le telecamere</text>
    </g>
    <line x1="10" y1="194" x2="260" y2="194" stroke="#fff" stroke-opacity="0.15"/>
    <g font-size="13" fill="#EDEDF2">
      <text x="32" y="216">Impostazioni…</text>
      <text x="256" y="216" text-anchor="end" fill="#9A9AA6">⌘,</text>
      <text x="32" y="240">Esci</text>
      <text x="256" y="240" text-anchor="end" fill="#9A9AA6">⌘Q</text>
    </g>
  </g>
</svg>
